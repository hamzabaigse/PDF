<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="pdfGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4b4b" />
      <stop offset="100%" stop-color="#d62828" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Base (Dark Mode Friendly) -->
  <rect width="512" height="512" rx="112" fill="#0f172a"/>

  <!-- PDF Document Shape -->
  <g filter="url(#shadow)">
    <path d="M140 96 C140 82.7452 150.745 72 164 72 H300 L372 144 V416 C372 429.255 361.255 440 348 440 H164 C150.745 440 140 429.255 140 416 V96 Z" fill="url(#pdfGrad)"/>
    <!-- Folded Corner -->
    <path d="M300 72 V132 C300 138.627 305.373 144 312 144 H372 L300 72 Z" fill="#ffffff" opacity="0.4"/>
  </g>

  <!-- PDF Text Overlay -->
  <text x="256" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="72" fill="#ffffff" text-anchor="middle" letter-spacing="2">PDF</text>

  <!-- Privacy Shield Badge -->
  <g transform="translate(300, 290)" filter="url(#shadow)">
    <path d="M40 0 C64 0 76 12 76 32 C76 68 40 88 40 88 C40 88 4 68 4 32 C4 12 16 0 40 0 Z" fill="url(#shieldGrad)"/>
    <path d="M26 38 L36 48 L56 26" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>
